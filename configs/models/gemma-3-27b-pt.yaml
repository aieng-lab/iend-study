# Gemma 3 27B PT + Gemma Scope 2 resid SAEs (all layers, 16k / small L0).
key: gemma-3-27b-pt
hf_model: google/gemma-3-27b-pt
sae_model: google/gemma-3-27b-pt
sae_release: gemma-scope-2-27b-pt-res-all
n_layers: 62
hf_resid_template: "model.layers.{layer}"
sae_id_template: "layer_{layer}_width_16k_l0_small"
arch: gemma3
suite_default: core
learning_rate: 1.0e-5

training:
  # GRADIEND has never run at 27B.  No valid Gemma GRADIEND LR evidence exists:
  # the gemma-2-2b screens were measured on a class-constant input signal
  # (left-padding label bug, fixed in the gradiend package 2026-09-25).  1e-6 is
  # the decade centre of the converged range on right-padded models (qwen-2B/9B,
  # llama-8B).  To be settled by the gender_en LR sweep on the fixed package.
  learning_rate_gradiend: 1.0e-6
  max_steps_gradiend: 500
  eval_steps_gradiend: 25
  # gender_en, 2026-09-13/15: ACTIEND 1e-5 / 100 steps and AGIEND 3e-3 / 500 steps
  # both converged during TRAINING (pair corr 0.949 at step 40 / 0.999 at step
  # 350).  The post-training encoder eval of those same checkpoints read 0.05 /
  # 0.27 -- an unresolved train-vs-eval discrepancy that no other model shows;
  # do not read it as an LR problem.
  learning_rate_actiend: 1.0e-5
  max_steps_actiend: 100
  eval_steps_actiend: 20
  learning_rate_decoder_actiend: 1.15e-2
  learning_rate_agiend: 3.0e-3
  # AGIEND decoder LR: 'auto' (reachability lift, calibrated during training) for the large models
  # (user directive 2026-09-25); on gpt2/pythia shared and auto gave the same causal effect.
  learning_rate_decoder_agiend: auto
  # float32 weights alone are ~~108GB for this 27B model, before gradients,
  # activations or optimizer state. The study defaulted to float32 everywhere
  # until 2026-08-28 simply because nothing ever forwarded a dtype; small models
  # stay float32 so their existing checkpoints and hashes are untouched.
  torch_dtype: bfloat16
  # Sharded loader.  With a device map the package keeps GPU 0 free of weights
  # (max_memory {0: "0GiB"}) for the GRADIEND head, so a 3-GPU job shards the
  # backbone over GPUs 1-2 (~260 GiB): bf16 weights 54 + grads ~51 GiB.  The
  # package auto-enables this only above 3 visible GPUs, hence explicit here.
  base_model_device_map: auto
  # Same fixed 1% layers-only projection as the other 4B+ models (~256M dims at
  # 27B; the head then needs ~10 GiB, which lives on the weight-free GPU 0).
  pre_prune:
    topk: 0.01
  # CGA uses this same streaming 1% coordinate projection at 27B.  Its
  # closed-form mean is exact within the projection and records the policy.
  cga_pre_prune: true
