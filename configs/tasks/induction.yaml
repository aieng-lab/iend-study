id: induction
classes: [MATCH, DISTRACTOR]
data:
  local_path: data/synthetic/induction_easy.csv
  generator: study.data.synthetic.build_induction
  neutral_hf: aieng-lab/biasneutral-ajibawa
  # easy | medium | hard — separate caches under data/synthetic/induction_{difficulty}.csv
  difficulty: easy
training:
  # Same knobs as ioi / gradiend.examples.train_source_both_ioi_one_pole
  source: both
  # max_steps was 2000 (inherited from the package example, never tuned here).
  # Convergence curves checked 2026-08-18 (correlation plateaus well before
  # 500) confirm 500 (study default) is enough for this task; same LR.
  max_steps: 500
  one_pole_classes: [MATCH]
ablations:
  pair: false
  one_pole: true
# SAE uses factual label_class only (MATCH vs neutrals): CF DISTRACTOR shares the
# same masked left-context, so it is not a separate SAE class. CAA expands CF rows.
causal:
  score: continuation_match
