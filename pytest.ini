[pytest]
# Keep pytest from recursing into large/generated/scratch trees when invoked
# bare from the repo root. `pytest_tmp_*` in particular can be left behind
# with a locked ACL by an interrupted Windows test run and is then
# undeletable from a normal shell; excluding it here means a stray leftover
# breaks nothing instead of aborting collection for the whole suite.
norecursedirs = .git __pycache__ .pytest_cache runs data slurm-logs build output pytest_tmp_* scratch_* tmp tmp_* iclr2027 exploratory
# tmp_path base: the default (%TEMP%/pytest-of-<user>) can be ACL-locked on Windows.
addopts = --basetemp=pytest_tmp_base
